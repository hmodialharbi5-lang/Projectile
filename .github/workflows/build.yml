name: Build Boss Projectile Multiplier

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Clone TShock 6.1.0
        run: |
          git clone --recursive --branch v6.1.0 \
            https://github.com/Pryaxis/TShock.git \
            TShock

      - name: Build TShock 6.1.0
        run: |
          cd TShock
          dotnet restore TShock.sln
          dotnet build TShock.sln \
            --configuration Release \
            --no-restore

      - name: Find TShock assemblies
        shell: bash
        run: |
          set -e

          mkdir -p lib

          echo "Searching for TShockAPI.dll..."

          TSHOCK_API=$(find TShock \
            -type f \
            -name "TShockAPI.dll" \
            -print -quit)

          if [ -z "$TSHOCK_API" ]; then
            echo "ERROR: TShockAPI.dll not found!"
            find TShock -type f -name "*.dll" | head -100
            exit 1
          fi

          echo "Found:"
          echo "$TSHOCK_API"

          cp "$TSHOCK_API" lib/TShockAPI.dll


          echo "Searching for TerrariaServer.dll..."

          TERRARIA=$(find TShock \
            -type f \
            -name "TerrariaServer.dll" \
            -print -quit)

          if [ -z "$TERRARIA" ]; then
            echo "ERROR: TerrariaServer.dll not found!"
            find TShock -type f -name "*.dll" | head -100
            exit 1
          fi

          echo "Found:"
          echo "$TERRARIA"

          cp "$TERRARIA" lib/TerrariaServer.dll


          echo "Searching for TerrariaApi.Server.dll..."

          API=$(find TShock \
            -type f \
            -name "TerrariaApi.Server.dll" \
            -print -quit)

          if [ -z "$API" ]; then
            echo "ERROR: TerrariaApi.Server.dll not found!"
            find TShock -type f -name "*.dll" | head -100
            exit 1
          fi

          echo "Found:"
          echo "$API"

          cp "$API" lib/TerrariaApi.Server.dll


          echo ""
          echo "===== REFERENCES ====="
          ls -lh lib/

      - name: Restore plugin
        run: |
          dotnet restore BossProjectileMultiplier.csproj

      - name: Build plugin
        run: |
          dotnet build BossProjectileMultiplier.csproj \
            --configuration Release \
            --no-restore

      - name: Check plugin DLL
        shell: bash
        run: |
          set -e

          echo "Searching for plugin DLL..."

          DLL=$(find bin/Release \
            -type f \
            -name "BossProjectileMultiplier.dll" \
            -print -quit)

          if [ -z "$DLL" ]; then
            echo "ERROR: BossProjectileMultiplier.dll was not created!"

            echo ""
            echo "Build output:"
            find bin/Release -type f 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "================================"
          echo "      BUILD SUCCESSFUL!"
          echo "================================"
          echo ""
          echo "DLL:"
          echo "$DLL"

      - name: Prepare plugin package
        shell: bash
        run: |
          set -e

          mkdir -p package/ServerPlugins

          DLL=$(find bin/Release \
            -type f \
            -name "BossProjectileMultiplier.dll" \
            -print -quit)

          cp "$DLL" \
            package/ServerPlugins/BossProjectileMultiplier.dll

          if [ -f README.txt ]; then
            cp README.txt package/README.txt
          fi

          cd package

          zip -r \
            ../BossProjectileMultiplier_TShock6.1.0.zip \
            .

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-DLL
          path: package/ServerPlugins/BossProjectileMultiplier.dll

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-TShock6.1.0
          path: BossProjectileMultiplier_TShock6.1.0.zip
