name: Build Boss Projectile Multiplier

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Download TShock 6.1.0
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tshock lib

          echo "Getting TShock 6.1.0 release information..."

          URL=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Pryaxis/TShock/releases/tags/v6.1.0" \
            | jq -r '.assets[]
              | select(.name | endswith(".zip"))
              | .browser_download_url' \
            | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::Could not find a TShock 6.1.0 ZIP asset."
            exit 1
          fi

          echo "Downloading:"
          echo "$URL"

          curl -fL --retry 3 "$URL" -o tshock/tshock.zip

          unzip -q tshock/tshock.zip -d tshock/server

      - name: Find TShock assemblies
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for required DLLs..."

          find tshock/server -type f \
            \( -name "TShockAPI.dll" \
            -o -name "TerrariaServer.dll" \
            -o -name "TerrariaApi.Server.dll" \) \
            -print

          for dll in TShockAPI.dll TerrariaServer.dll TerrariaApi.Server.dll
          do
            FILE=$(find tshock/server -type f -name "$dll" -print -quit)

            if [ -z "$FILE" ]; then
              echo "::error::Could not find $dll"
              exit 1
            fi

            echo "Found $dll:"
            echo "$FILE"

            cp "$FILE" "lib/$dll"
          done

      - name: Show project
        shell: bash
        run: |
          echo "Project files:"
          find . -maxdepth 3 -type f \
            \( -name "*.cs" -o -name "*.csproj" \) \
            -print

      - name: Restore
        run: |
          dotnet restore BossProjectileMultiplier.csproj

      - name: Build
        run: |
          dotnet build BossProjectileMultiplier.csproj \
            --configuration Release \
            --no-restore

      - name: Check DLL
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for compiled DLL..."

          DLL=$(find bin/Release -type f \
            -name "BossProjectileMultiplier.dll" \
            -print -quit)

          if [ -z "$DLL" ]; then
            echo "::error::BossProjectileMultiplier.dll was not created."
            echo "Build directory:"
            find bin -type f 2>/dev/null || true
            exit 1
          fi

          echo "SUCCESS!"
          echo "DLL:"
          echo "$DLL"

      - name: Prepare plugin ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/ServerPlugins

          DLL=$(find bin/Release -type f \
            -name "BossProjectileMultiplier.dll" \
            -print -quit)

          cp "$DLL" \
            package/ServerPlugins/BossProjectileMultiplier.dll

          if [ -f README.txt ]; then
            cp README.txt package/README.txt
          fi

          cd package

          zip -r \
            ../BossProjectileMultiplier_TShock6.1.0.zip \
            .

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-DLL
          path: package/ServerPlugins/BossProjectileMultiplier.dll

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-TShock6.1.0
          path: BossProjectileMultiplier_TShock6.1.0.zip
