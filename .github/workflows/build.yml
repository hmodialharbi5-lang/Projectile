name: Build Boss Projectile Multiplier

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Check project files
        run: |
          echo "===== PROJECT ====="
          ls -la
          echo
          echo "===== SOURCE ====="
          find . -maxdepth 3 -type f
          echo
          echo "===== CS FILE ====="
          cat BossProjectileMultiplier/BossProjectileMultiplier.cs 2>/dev/null || true
          cat BossProjectileMultiplier.cs 2>/dev/null || true

      - name: Check references
        run: |
          echo "===== CSProj ====="
          cat BossProjectileMultiplier.csproj
          echo
          echo "===== LIB ====="
          ls -lah lib 2>/dev/null || echo "NO LIB FOLDER"

      - name: Restore
        run: |
          dotnet restore BossProjectileMultiplier.csproj 2>&1 | tee restore.log
          exit ${PIPESTATUS[0]}

      - name: Build
        run: |
          set +e

          echo "======================================"
          echo "        BUILDING PLUGIN"
          echo "======================================"

          dotnet build BossProjectileMultiplier.csproj \
            -c Release \
            --no-restore \
            2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          echo
          echo "======================================"
          echo "        BUILD RESULT: $RESULT"
          echo "======================================"

          echo
          echo "===== ERRORS ONLY ====="

          grep -i "error" build.log || echo "NO ERROR TEXT FOUND"

          echo
          echo "===== WARNINGS ONLY ====="

          grep -i "warning" build.log || echo "NO WARNING TEXT FOUND"

          echo
          echo "===== LAST 30 LINES ====="

          tail -n 30 build.log

          exit $RESULT

      - name: Find DLL
        if: success()
        run: |
          echo "===== DLL ====="

          find . \
            -type f \
            -name "BossProjectileMultiplier.dll" \
            -print

      - name: Package
        if: success()
        run: |
          mkdir -p package/ServerPlugins

          cp "$(find . \
            -type f \
            -name "BossProjectileMultiplier.dll" \
            -print -quit)" \
            package/ServerPlugins/

          cd package

          zip -r ../BossProjectileMultiplier.zip .

      - name: Upload DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-DLL
          path: package/ServerPlugins/BossProjectileMultiplier.dll

      - name: Upload ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier
          path: BossProjectileMultiplier.zip
