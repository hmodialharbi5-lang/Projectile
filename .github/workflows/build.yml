name: Build Boss Projectile Multiplier

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Download TShock 6.1.0
        shell: bash
        run: |
          set -e

          mkdir -p tshock lib

          curl -fL \
            "https://github.com/Pryaxis/TShock/releases/download/v6.1.0/TShock-6.1.0-for-Terraria-1.4.5.6.zip" \
            -o tshock/tshock.zip

          unzip -q tshock/tshock.zip -d tshock/server

      - name: Find assemblies
        shell: bash
        run: |
          set -e

          echo "Searching for TShock assemblies..."

          find tshock/server -type f \
            \( -name "TShockAPI.dll" \
            -o -name "TerrariaServer.dll" \
            -o -name "TerrariaApi.Server.dll" \) \
            -print

          for dll in TShockAPI.dll TerrariaServer.dll TerrariaApi.Server.dll
          do
            FILE=$(find tshock/server -type f -name "$dll" | head -n 1)

            if [ -z "$FILE" ]; then
              echo "ERROR: Could not find $dll"
              exit 1
            fi

            cp "$FILE" "lib/$dll"
          done

      - name: Restore
        run: dotnet restore BossProjectileMultiplier.csproj

      - name: Build
        run: dotnet build BossProjectileMultiplier.csproj -c Release --no-restore

      - name: Check DLL
        shell: bash
        run: |
          set -e

          DLL=$(find bin/Release -type f \
            -name "BossProjectileMultiplier.dll" \
            | head -n 1)

          if [ -z "$DLL" ]; then
            echo "ERROR: DLL was not created."
            exit 1
          fi

          echo "DLL created:"
          echo "$DLL"

      - name: Prepare plugin package
        shell: bash
        run: |
          set -e

          mkdir -p package/ServerPlugins

          cp "$(find bin/Release -type f \
            -name "BossProjectileMultiplier.dll" \
            | head -n 1)" \
            package/ServerPlugins/

          cp README.txt package/ 2>/dev/null || true

          cd package
          zip -r ../BossProjectileMultiplier_TShock6.1.0.zip .

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-DLL
          path: package/ServerPlugins/BossProjectileMultiplier.dll

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-TShock6.1.0
          path: BossProjectileMultiplier_TShock6.1.0.zip
