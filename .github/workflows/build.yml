name: Build Boss Projectile Multiplier

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Download TShock 6.1.0
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tshock/server
          mkdir -p lib

          echo "Finding TShock 6.1.0 release..."

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Pryaxis/TShock/releases/tags/v6.1.0" \
            -o release.json

          echo "Available assets:"
          jq -r '.assets[].name' release.json

          URL=$(jq -r '
            .assets[]
            | select(.name | endswith(".zip"))
            | .browser_download_url
          ' release.json | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::No ZIP asset found for TShock 6.1.0"
            exit 1
          fi

          echo "Downloading:"
          echo "$URL"

          curl -fL --retry 3 "$URL" \
            -o tshock/tshock.zip

          echo "Extracting..."

          unzip -q tshock/tshock.zip \
            -d tshock/server

          echo "Extracted files:"
          find tshock/server -type f | head -200

      - name: Find TShockAPI.dll
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for TShockAPI.dll..."

          FILE=$(find tshock/server \
            -type f \
            -iname "TShockAPI.dll" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "::error::TShockAPI.dll was not found."

            echo ""
            echo "DLL files that were found:"
            find tshock/server \
              -type f \
              -iname "*.dll" \
              -print

            exit 1
          fi

          echo "FOUND:"
          echo "$FILE"

          cp "$FILE" lib/TShockAPI.dll

      - name: Find TerrariaServer.dll
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find tshock/server \
            -type f \
            -iname "TerrariaServer.dll" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "::error::TerrariaServer.dll was not found."

            find tshock/server \
              -type f \
              -iname "*.dll" \
              -print

            exit 1
          fi

          echo "FOUND:"
          echo "$FILE"

          cp "$FILE" lib/TerrariaServer.dll

      - name: Find TerrariaApi.Server.dll
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find tshock/server \
            -type f \
            -iname "TerrariaApi.Server.dll" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "::error::TerrariaApi.Server.dll was not found."

            find tshock/server \
              -type f \
              -iname "*.dll" \
              -print

            exit 1
          fi

          echo "FOUND:"
          echo "$FILE"

          cp "$FILE" lib/TerrariaApi.Server.dll

      - name: Show references
        shell: bash
        run: |
          echo "References:"
          ls -lh lib/

      - name: Restore
        run: |
          dotnet restore BossProjectileMultiplier.csproj

      - name: Build
        run: |
          dotnet build BossProjectileMultiplier.csproj \
            --configuration Release \
            --no-restore

      - name: Check DLL
        shell: bash
        run: |
          set -euo pipefail

          DLL=$(find bin/Release \
            -type f \
            -iname "BossProjectileMultiplier.dll" \
            -print -quit)

          if [ -z "$DLL" ]; then
            echo "::error::BossProjectileMultiplier.dll was not created."

            echo "Build output:"
            find bin/Release -type f 2>/dev/null || true

            exit 1
          fi

          echo "================================"
          echo "BUILD SUCCESSFUL!"
          echo "================================"
          echo "DLL:"
          echo "$DLL"

      - name: Package DLL
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/ServerPlugins

          DLL=$(find bin/Release \
            -type f \
            -iname "BossProjectileMultiplier.dll" \
            -print -quit)

          cp "$DLL" \
            package/ServerPlugins/BossProjectileMultiplier.dll

          if [ -f README.txt ]; then
            cp README.txt package/
          fi

          cd package

          zip -r \
            ../BossProjectileMultiplier_TShock6.1.0.zip \
            .

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-DLL
          path: package/ServerPlugins/BossProjectileMultiplier.dll

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-TShock6.1.0
          path: BossProjectileMultiplier_TShock6.1.0.zip
