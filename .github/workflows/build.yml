name: Build Boss Projectile Multiplier

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Show project
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f -print

          echo
          echo "===== CSPROJ ====="
          cat BossProjectileMultiplier.csproj

      - name: Restore NuGet packages
        run: |
          dotnet restore BossProjectileMultiplier.csproj

      - name: Build plugin
        run: |
          dotnet build BossProjectileMultiplier.csproj \
            --configuration Release \
            --no-restore

      - name: Find DLL
        shell: bash
        run: |
          set -e

          DLL=$(find bin/Release \
            -type f \
            -name "BossProjectileMultiplier.dll" \
            -print -quit)

          if [ -z "$DLL" ]; then
            echo "::error::BossProjectileMultiplier.dll was not created."
            echo
            echo "Build files:"
            find bin/Release -type f 2>/dev/null || true
            exit 1
          fi

          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"
          echo "DLL: $DLL"

      - name: Package plugin
        shell: bash
        run: |
          set -e

          mkdir -p package/ServerPlugins

          DLL=$(find bin/Release \
            -type f \
            -name "BossProjectileMultiplier.dll" \
            -print -quit)

          cp "$DLL" \
            package/ServerPlugins/BossProjectileMultiplier.dll

          if [ -f README.txt ]; then
            cp README.txt package/README.txt
          fi

          cd package

          zip -r \
            ../BossProjectileMultiplier-TShock6.1.0.zip \
            .

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-DLL
          path: package/ServerPlugins/BossProjectileMultiplier.dll

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-TShock6.1.0
          path: BossProjectileMultiplier-TShock6.1.0.zip
