name: Build Boss Projectile Multiplier

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download TShock 6.1.0
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tshock lib

          API="https://api.github.com/repos/Pryaxis/TShock/releases/tags/v6.1.0"

          URL="$(curl -fsSL "$API" \
            | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' \
            | head -n 1)"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Could not find the TShock 6.1.0 release ZIP."
            exit 1
          fi

          echo "Downloading: $URL"
          curl -fL "$URL" -o tshock/tshock.zip

          unzip -q tshock/tshock.zip -d tshock/server

      - name: Locate TShock assemblies
        shell: bash
        run: |
          set -euo pipefail

          find tshock/server -type f \( \
            -name "TShockAPI.dll" -o \
            -name "TerrariaServer.dll" -o \
            -name "TerrariaApi.Server.dll" \
          \) -print

          for dll in TShockAPI.dll TerrariaServer.dll TerrariaApi.Server.dll; do
            found="$(find tshock/server -type f -name "$dll" -print -quit)"
            if [ -z "$found" ]; then
              echo "Missing required assembly: $dll"
              exit 1
            fi
            cp "$found" "lib/$dll"
          done

      - name: Build
        run: dotnet build BossProjectileMultiplier.csproj -c Release --no-restore

      - name: Package DLL
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/ServerPlugins

          DLL="$(find bin/Release -type f -name "BossProjectileMultiplier.dll" -print -quit)"
          if [ -z "$DLL" ]; then
            echo "BossProjectileMultiplier.dll was not produced."
            exit 1
          fi

          cp "$DLL" package/ServerPlugins/
          cp README.txt package/ 2>/dev/null || true

          cd package
          zip -r ../BossProjectileMultiplier_TShock6.1.0.zip .

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-DLL
          path: package/ServerPlugins/BossProjectileMultiplier.dll

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BossProjectileMultiplier-TShock6.1.0
          path: BossProjectileMultiplier_TShock6.1.0.zip

